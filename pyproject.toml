[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravdyn"
version = "0.1.0"
description = "A minimal Python package exposing a single polyhedral_approach function."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Safwan Aljbaae", email = "safwan.aljbaae@gmail.com"}
]
license = {text = "MIT"}
dependencies = [
    "numpy==2.4.4",
    "trimesh==4.11.5",
    "matplotlib==3.10.8",
    "plotly==6.6.0",
    "pytest==9.0.2",
    "pandas==3.0.2",
    "jax==0.9.2",
    "requests==2.33.1",
    "sympy==1.14.0",
    "dotenv==0.9.9",
    "scipy-stubs==1.17.1.4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
